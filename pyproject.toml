[project]
name = "ollajev"
version = "0.3.0"
description = "Run System One decision models from Hugging Face locally behind the Jev / System One API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Vijay Krishna Kudva" }]
keywords = ["jev", "system-one", "typesafe", "decision-model", "huggingface", "ollama", "llama.cpp", "classification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.14,<3",
    "transformers>=5.19,<6",
    "huggingface-hub>=1.32,<2",
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
    "textual>=8.2,<9",
    "laya>=0.3.4,<0.4",
    "von-sdk>=1.3.7,<1.4",
    "gliclass>=0.1.20,<0.2",
    "decider-ai>=1.8.1,<2",
    "llama-cpp-python>=0.3.36,<0.4",
    "peft>=0.21,<1",
    "platformdirs>=4.5,<5",
    "psutil>=7.2,<8",
    "onnxruntime>=1.30.0",
    "pillow>=12,<13",
    "av>=19,<20",
    "torchvision>=0.29,<1",
    "mlx-vlm>=0.7.6,<0.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/nvkudva/ollajev"
Source = "https://github.com/nvkudva/ollajev"
Issues = "https://github.com/nvkudva/ollajev/issues"
Changelog = "https://github.com/nvkudva/ollajev/blob/main/CHANGELOG.md"

[project.scripts]
ollajev = "ollajev.ui.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "typesafe-sdk==0.7.2",
    "ruff==0.16.10",
    "pyright==1.1.414",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
# Rebuild when the source changes, not only pyproject.toml, so `uv tool install .` picks up edits.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]

# PyPI's Linux torch wheel drags in the whole CUDA toolkit (several GB). Default Linux to the
# CPU build; for a GPU box, sync against https://download.pytorch.org/whl/cu130 instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/ollajev"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/ollajev/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "PT", "RUF"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable

[tool.pyright]
include = ["src"]
exclude = ["src/ollajev/_vendor"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "PT006", "PT011", "PT018", "RUF012"]
# client.py talks to a local http:// server and maps 0.0.0.0 to a reachable address; cli.py probes the
# server it started and execs the service viewer; service.py runs launchctl/systemctl.
"src/ollajev/client.py" = ["S104", "S310"]
"src/ollajev/ui/cli.py" = ["S310", "S606"]
"src/ollajev/service.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
