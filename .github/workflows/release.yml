name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Verify tag matches pyproject version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version v$version" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        # The notes are this version's CHANGELOG.md section, then GitHub's list of merged pull requests.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh tools/release_notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes --verify-tag

  homebrew:
    # Points nvkudva/homebrew-tap's formula at the new PyPI release. Pushes with HOMEBREW_TAP_DEPLOY_KEY: the
    # private half of a write deploy key on nvkudva/homebrew-tap, so it can reach that one repo only.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Skip without a tap token
        if: env.TAP_KEY == ''
        run: echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not set; update the Homebrew formula by hand"
      - name: Read the sdist URL and checksum from PyPI
        if: env.TAP_KEY != ''
        id: sdist
        run: |
          version="${GITHUB_REF_NAME#v}"
          json=$(curl -fsSL --retry 10 --retry-delay 15 --retry-all-errors "https://pypi.org/pypi/ollajev/$version/json")
          echo "url=$(echo "$json" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$json" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: env.TAP_KEY != ''
        with:
          repository: nvkudva/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Update the formula and push
        if: env.TAP_KEY != ''
        env:
          URL: ${{ steps.sdist.outputs.url }}
          SHA256: ${{ steps.sdist.outputs.sha256 }}
        run: |
          test -n "$URL" && test -n "$SHA256"
          sed -i -E "s|^  url \".*\"|  url \"$URL\"|; s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" Formula/ollajev.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ollajev ${GITHUB_REF_NAME#v}"
          git push
