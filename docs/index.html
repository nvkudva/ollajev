<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollajev</title>
<meta name="description" content="Like Ollama, for System One decision models: a terminal UI to browse, search, download and serve models from Hugging Face, behind TypeSafe's /v1/systemone API. Now with Vega, a 73k-context model that reads images, as the default.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens: giraffe ochre and patch brown on a cool sage ground ---------- */
:root {
  --bg: #eef2ec;
  --surface: #f8faf6;
  --ink: #17262a;
  --muted: #536266;
  --rule: #cfd8d0;
  --ochre: #e3a32f;
  --ochre-ink: #2b1a07;
  --patch: #8a5222;
  --teal: #1d6a72;
  --teal-soft: #d8e8e6;
  --track: #dde4dc;
  --code-bg: #17262a;
  --code-ink: #dbe6e1;
  --code-key: #f2c46b;
  --code-str: #9fd3cc;
  --focus: #1d6a72;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .1, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101b1b; --surface: #162424; --ink: #e5eee8; --muted: #9aaca8; --rule: #284040;
    --ochre: #f2b84b; --ochre-ink: #1d1204; --patch: #d08a4a; --teal: #6cc2c1; --teal-soft: #1c3434;
    --track: #223535; --code-bg: #0b1414; --code-ink: #d3e0db; --code-key: #f2c46b; --code-str: #8fcfc6; --focus: #6cc2c1;
  }
}
:root[data-theme="dark"] {
  --bg: #101b1b; --surface: #162424; --ink: #e5eee8; --muted: #9aaca8; --rule: #284040;
  --ochre: #f2b84b; --ochre-ink: #1d1204; --patch: #d08a4a; --teal: #6cc2c1; --teal-soft: #1c3434;
  --track: #223535; --code-bg: #0b1414; --code-ink: #d3e0db; --code-key: #f2c46b; --code-str: #8fcfc6; --focus: #6cc2c1;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--display); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: var(--teal); text-underline-offset: 3px; }
code, pre, kbd { font-family: var(--mono); }
figure { margin: 0; }
p code, li code, td code { font-size: .86em; background: var(--teal-soft); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.skip { position: absolute; left: -9999px; top: 8px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 50; }
.skip:focus { left: 16px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 640px) { .wrap { padding: 0 28px; } }
.band { padding: 88px 0; }
.band + .band { border-top: 1px solid var(--rule); }
h1, h2, h3 { font-family: var(--display); margin: 0; }
h2 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.06; font-weight: 800; letter-spacing: -0.03em; font-variation-settings: "opsz" 96; max-width: 20ch; }
h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.lede { color: var(--muted); font-size: 18px; max-width: 60ch; margin: 16px 0 40px; }
.muted { color: var(--muted); }

/* ---------- Primitives ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font: 600 16px var(--display); text-decoration: none; border: 1.5px solid var(--ink); color: var(--ink); background: transparent; cursor: pointer; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--ochre); border-color: var(--ochre); color: var(--ochre-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--ochre); color: var(--ochre-ink); }
.btn svg { width: 18px; height: 18px; fill: currentColor; }

.cmd { display: flex; align-items: center; gap: 12px; background: var(--code-bg); color: var(--code-ink); border-radius: 12px; padding: 12px 12px 12px 18px; font: 14px/1.5 var(--mono); min-width: 0; }
.cmd .prompt { color: var(--code-key); user-select: none; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: pre; scrollbar-width: thin; background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.copy { flex: none; background: transparent; color: var(--code-ink); border: 1px solid color-mix(in srgb, var(--code-ink) 30%, transparent); border-radius: 8px; padding: 5px 11px; font: 12px var(--mono); cursor: pointer; }
.copy:hover { border-color: var(--code-key); color: var(--code-key); }

pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); font: 12.5px/1.6 var(--mono); padding: 18px; overflow-x: auto; border-radius: 0 0 14px 14px; min-width: 0; }
pre.code .k { color: var(--code-key); }
pre.code .s { color: var(--code-str); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tab { background: transparent; border: 1.5px solid var(--rule); color: var(--muted); padding: 7px 15px; border-radius: 999px; font: 500 15px var(--display); cursor: pointer; }
.tab:hover { color: var(--ink); border-color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

kbd { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 7px; border: 1.5px solid var(--rule); border-bottom-width: 3px; border-radius: 7px; background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink); }

/* ---------- Nav ---------- */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule); }
.nav .wrap { display: flex; align-items: center; gap: 20px; height: 62px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -0.03em; color: var(--ink); text-decoration: none; }
.brand img { width: 32px; height: 32px; }
.nav ul { display: flex; gap: 22px; list-style: none; margin: 0 0 0 auto; padding: 0; font-size: 15px; }
.nav ul a { color: var(--muted); text-decoration: none; }
.nav ul a:hover { color: var(--ink); }
.theme-btn { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
.theme-btn svg { width: 18px; height: 18px; }
.nav .gh { font-weight: 600; color: var(--ink); text-decoration: none; }
@media (max-width: 760px) { .nav ul li:not(.keep) { display: none; } }

/* ---------- Hero ---------- */
.hero { padding: 80px 0 56px; }
.hero-grid { display: grid; gap: 48px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: end; }
.hero h1 { font-size: clamp(38px, 6.2vw, 78px); line-height: .92; font-weight: 800; letter-spacing: -0.045em; font-variation-settings: "opsz" 96; }
.hero h1 span { display: block; color: var(--muted); font-weight: 500; }
.hero .pitch { font-size: 19px; color: var(--muted); max-width: 46ch; margin: 0 0 22px; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.hero .install { margin: 0; min-width: 0; }
.installs { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); max-width: 860px; margin-top: 40px; }
@media (max-width: 860px) { .installs { margin-top: 28px; } }
.hero .install figcaption { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.hero .install.alt figcaption { font-size: 13px; margin-bottom: 6px; }
.hero .install.alt .cmd { background: transparent; color: var(--muted); border: 1px solid var(--rule); padding: 7px 8px 7px 14px; font-size: 12.5px; border-radius: 10px; }
.cmd-stack { display: grid; gap: 6px; }
.hero .install.alt .copy { color: var(--muted); border-color: var(--rule); padding: 3px 9px; font-size: 11px; }
@media (max-width: 860px) { .hero-grid { grid-template-columns: minmax(0, 1fr); gap: 28px; } .hero { padding-top: 52px; } }

/* The one memorable element: a calibration scale where the answer lands */
.scale { margin-top: 64px; padding-top: 22px; border-top: 1.5px solid var(--ink); }
.scale-q { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; align-items: baseline; margin-bottom: 26px; }
.scale-q q { font-size: clamp(17px, 2.2vw, 22px); font-weight: 500; max-width: 52ch; }
.scale-q .ask { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.ruler { position: relative; height: 54px; }
.ruler .ticks { position: absolute; inset: auto 0 18px 0; height: 16px; background:
  repeating-linear-gradient(90deg, var(--ink) 0 1.5px, transparent 1.5px 10%) left bottom / 100% 16px no-repeat,
  repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 2%) left bottom / 100% 7px no-repeat;
  border-right: 1.5px solid var(--ink); opacity: .7; }
.ruler .ends { position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
.ruler .fill { position: absolute; left: 0; bottom: 18px; height: 6px; background: var(--ochre); border-radius: 3px; width: var(--p); transition: width 1400ms var(--ease); }
.ruler .pin { position: absolute; bottom: 18px; left: var(--p); transform: translateX(-50%); transition: left 1400ms var(--ease); display: flex; flex-direction: column; align-items: center; }
.ruler .pin b { font: 700 15px var(--mono); background: var(--ink); color: var(--bg); padding: 3px 9px; border-radius: 6px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.ruler .pin i { width: 2px; height: 22px; background: var(--ink); }

/* ---------- How it works ---------- */
.flow { display: grid; gap: 20px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); counter-reset: f; padding: 0; margin: 0; }
.flow li { list-style: none; position: relative; padding-top: 18px; border-top: 3px solid var(--ink); }
.flow li::before { counter-increment: f; content: counter(f); font: 700 14px var(--mono); color: var(--patch); display: block; margin-bottom: 10px; }
.flow p { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
.flow ol { padding: 0; margin: 0; }
.types { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 48px; }
.type { background: var(--surface); border: 1px solid var(--rule); border-radius: 18px 18px 18px 4px; padding: 22px; }
.type code.name { font: 700 15px var(--mono); color: var(--patch); }
.type h3 { margin: 6px 0 6px; }
.type p { margin: 0; color: var(--muted); font-size: 15.5px; }
@media (max-width: 820px) { .flow, .types { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Demo ---------- */
.demo { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 900px) { .demo { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--rule); font: 600 13px var(--mono); color: var(--muted); }
.panel-head .verb { color: var(--patch); }
.answers { padding: 20px 18px 22px; }
.answers .state { font-size: 17px; font-weight: 500; margin: 0 0 22px; padding-left: 14px; border-left: 3px solid var(--ochre); }
.q { margin-bottom: 22px; }
.q:last-child { margin-bottom: 0; }
.q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; font-size: 15px; }
.q-head .t { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.bar { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 4.2em; gap: 10px; align-items: center; font: 12.5px var(--mono); color: var(--muted); padding: 3px 0; }
.bar.top { color: var(--ink); font-weight: 600; }
.bar .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; width: 0; background: var(--teal); border-radius: 5px; transition: width 700ms var(--ease); }
.bar.top .fill { background: var(--ochre); }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; }
.conf { font: 12px var(--mono); color: var(--muted); margin-top: 6px; }
@media (max-width: 420px) { .bar { grid-template-columns: minmax(0, 6.5em) minmax(0, 1fr) 3.8em; gap: 8px; } }

/* ---------- Drop-in callout ---------- */
.dropin { background: var(--ochre); color: var(--ochre-ink); }
.band.dropin + .band { border-top: 0; }
.dropin-grid { display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
.dropin h2 { color: var(--ochre-ink); }
.dropin p { font-size: 18px; max-width: 52ch; margin: 16px 0 0; }
.dropin p code { background: color-mix(in srgb, var(--ochre-ink) 12%, transparent); }
.dropin .cmd { margin-bottom: 10px; }
.dropin small { display: block; font-size: 14px; opacity: .8; }
@media (max-width: 860px) { .dropin-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Tools: TUI and CLI ---------- */
.tools { display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 860px) { .tools { grid-template-columns: minmax(0, 1fr); } }
.tools h3 { margin-bottom: 8px; }
.tools > div > p { color: var(--muted); margin: 0 0 18px; font-size: 16px; }
.keys, .cmds { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.keys li, .cmds li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15.5px; }
.cmds li { grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr); }
.cmds code { font: 600 14px var(--mono); color: var(--patch); }
.cmds span, .keys span { color: var(--muted); }

/* ---------- Models ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; margin-bottom: 16px; }
.filters fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters legend { float: left; font-size: 14px; color: var(--muted); margin-right: 6px; }
.filters .tabs { margin: 0; }
.filters .tab { padding: 5px 12px; font-size: 14px; }
.search { flex: 1 1 220px; min-width: 0; padding: 10px 14px; border-radius: 999px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); font: 15px var(--display); }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
caption { text-align: left; padding: 12px 16px; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--rule); }
th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
td.name code { background: none; padding: 0; font-size: 13.5px; overflow-wrap: anywhere; }
td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.about { color: var(--muted); min-width: 16em; }
.pill { display: inline-block; font: 600 11.5px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); white-space: nowrap; }
.pill.def { background: var(--ochre); color: var(--ochre-ink); margin-left: 6px; }
.models-note { color: var(--muted); font-size: 15px; margin-top: 16px; max-width: 70ch; }

/* ---------- Quick start ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 34px; counter-reset: s; max-width: 760px; }
.steps > li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 18px; }
.steps > li::before { counter-increment: s; content: counter(s); width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 17px var(--mono); }
.steps h3 { margin: 8px 0 8px; }
.steps p { color: var(--muted); margin: 0 0 12px; font-size: 16px; }

/* ---------- Footer ---------- */
footer { border-top: 1px solid var(--rule); padding: 36px 0 52px; color: var(--muted); font-size: 15px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; }
footer .end { margin-left: auto; max-width: 46ch; }
@media (max-width: 640px) { footer .end { margin-left: 0; } }

/* ---------- Screenshots ---------- */
.shot { margin: 0; }
.shot img { display: block; width: 100%; height: auto; border-radius: 14px; border: 1.5px solid var(--ink); background: #e9e9ec; }
.shot figcaption { font-size: 14.5px; color: var(--muted); margin-top: 12px; max-width: 70ch; }
.hero .shot { margin-top: 56px; }
.video { margin: 0; }
.video video { display: block; width: 100%; height: auto; border-radius: 14px; border: 1.5px solid var(--ink); background: #f7f8fd; }

/* ---------- Model manager ---------- */
.flow kbd { margin-right: 8px; vertical-align: 2px; }
.manager-grid { display: grid; gap: 40px; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); margin-top: 56px; align-items: start; }
.manager-grid h3 { margin-bottom: 12px; }
.manager-note { color: var(--muted); font-size: 15.5px; margin: 18px 0 0; }
@media (max-width: 960px) { .flow[style] { --cols: 2 !important; } .manager-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .flow[style] { --cols: 1 !important; } }

/* ---------- Default model ---------- */
.defaults { margin-top: 56px; max-width: 760px; padding: 26px 26px 22px; border: 1.5px solid var(--ink); border-radius: 18px 18px 18px 4px; background: var(--surface); }
.defaults p { margin: 8px 0 14px; color: var(--muted); font-size: 16px; }
.defaults ul { margin: 0; padding: 0; list-style: none; }
.defaults li { padding: 9px 0; border-top: 1px solid var(--rule); font-size: 15.5px; }
.defaults li code:first-child { font-weight: 600; }

/* ---------- Commands ---------- */
.cmds li.extra code { color: var(--teal); }
.cmds .pill { margin-left: 8px; }
.compare td:first-child, .compare th:first-child { font-weight: 600; color: var(--ink); white-space: nowrap; }
.compare td { color: var(--muted); }
.commands-grid { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); }
@media (max-width: 860px) { .commands-grid { grid-template-columns: minmax(0, 1fr); } }
.cmd-start { margin: 0 0 22px; }
.cmd-start p { color: var(--muted); font-size: 15.5px; margin: 8px 0 0; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}
</style>

<script type="module">
import { html, render, useState, useEffect } from "https://esm.sh/htm@3.1.1/preact/standalone";

/* =========================================================
   1. Constants and data
   ========================================================= */
const REPO = "https://github.com/nvkudva/ollajev";
const RAW = "https://raw.githubusercontent.com/nvkudva/ollajev/main";
const CHANGELOG = `${REPO}/blob/main/CHANGELOG.md`;
const THEME_KEY = "ollajev.theme";

const MODELS = [
  ["nandakishorm/vega-08b-public-intents", 1.84, "PyTorch", "English", "Vega, physics engine on a frozen Qwen3.5-0.8B, 73k context", true],
  ["nandakishorm/vega-08b-public-intents:4b", 9.5, "PyTorch", "English", "Vega 4B, physics engine on a frozen Qwen3.5-4B, 73k context"],
  ["Mapika/decider-4b-GGUF:Q4_K_M", 2.7, "llama.cpp", "English", "Qwen3.5-4B decider, 4-bit GGUF"],
  ["Mapika/decider-2b-GGUF:Q4_K_M", 1.2, "llama.cpp", "English", "Qwen3.5-2B decider, 4-bit GGUF"],
  ["Mapika/decider-2b-GGUF:Q8_0", 2.0, "llama.cpp", "English", "Qwen3.5-2B decider, 8-bit GGUF"],
  ["Mapika/decider-2b", 3.76, "PyTorch", "English", "Qwen3.5-2B decider, bf16"],
  ["Mapika/decider-0.8b", 1.5, "PyTorch", "English", "Qwen3.5-0.8B decider, bf16"],
  ["convaiinnovations/laya", 0.85, "PyTorch", "English", "Laya, ModernBERT-large, general purpose"],
  ["convaiinnovations/laya-multilingual", 0.68, "PyTorch", "100+ languages", "Laya, mmBERT-base"],
  ["convaiinnovations/laya-typed-decisions", 0.85, "PyTorch", "English", "Laya tuned for agent traces, support, invoices"],

const prefersReducedMotion = () => window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
const pct = (v) => `${(v * 100).toFixed(1)}%`;

/** Flips to true shortly after mount or after `key` changes, so CSS width transitions run. */
function useArrive(key) {
  const [on, setOn] = useState(false);
  useEffect(() => {
    setOn(false);
    const t = setTimeout(() => setOn(true), prefersReducedMotion() ? 0 : 80);
    return () => clearTimeout(t);
  }, [key]);
  return on;
}

function Copy({ text, label = "command" }) {
  const [done, setDone] = useState(false);
  const go = () => navigator.clipboard?.writeText(text).then(() => { setDone(true); setTimeout(() => setDone(false), 1500); });
  return html`<button type="button" class="copy" onClick=${go} aria-label=${`Copy ${label}`}>
    <span aria-live="polite">${done ? "Copied" : "Copy"}</span>
  </button>`;
}

function Command({ text, label }) {
  return html`<div class="cmd"><span class="prompt" aria-hidden="true">$</span><code>${text}</code><${Copy} text=${text} label=${label} /></div>`;
}

/** Minimal JSON highlighter: keys in ochre, strings in teal. Built from text nodes, never innerHTML. */
function CodeBlock({ value, label }) {
  const src = JSON.stringify(value, null, 2);
  const parts = [];
  const re = /("(?:[^"\\]|\\.)*")(\s*:)?/g;
  let last = 0, m;
  while ((m = re.exec(src))) {
    if (m.index > last) parts.push(src.slice(last, m.index));
    parts.push(html`<span class=${m[2] ? "k" : "s"}>${m[1]}</span>`);
    if (m[2]) parts.push(m[2]);
    last = re.lastIndex;
  }
  parts.push(src.slice(last));
  return html`<pre class="code" tabindex="0" aria-label=${label}>${parts}</pre>`;
}

function Tabs({ items, value, onChange, label, controls }) {
  const onKey = (e) => {
    const i = items.indexOf(value);
    const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    const next = items[(i + d + items.length) % items.length];
    onChange(next);
    e.currentTarget.parentElement.querySelector(`[data-v="${CSS.escape(next)}"]`)?.focus();
  };
  return html`<div class="tabs" role="tablist" aria-label=${label}>
    ${items.map((k) => html`<button type="button" role="tab" class="tab" data-v=${k}
      aria-selected=${k === value} aria-controls=${controls} tabindex=${k === value ? 0 : -1}
      onClick=${() => onChange(k)} onKeyDown=${onKey}>${k}</button>`)}
  </div>`;
}

function Section({ id, title, lede, className = "", children }) {
  const hid = `${id}-title`;
  return html`<section id=${id} class=${`band ${className}`} aria-labelledby=${hid}><div class="wrap">
    <h2 id=${hid}>${title}</h2>
    ${lede ? html`<p class="lede">${lede}</p>` : null}
    ${children}
  </div></section>`;
}

function Bars({ answer, on }) {
  const dist = answer.probabilities ?? { yes: answer.noul, no: 1 - answer.noul };
  const rows = Object.entries(dist).sort((a, b) => b[1] - a[1]);
  return html`<div role="list">${rows.map(([k, v], i) => {
    const label = answer.legend?.[k] ?? k;
    return html`<div role="listitem" class=${"bar" + (i === 0 ? " top" : "")} aria-label=${`${label}: ${pct(v)}`}>
      <span class="label" title=${label}>${label}</span>
      <span class="track"><span class="fill" style=${{ width: on ? `${v * 100}%` : "0%", display: "block" }}></span></span>
      <span class="pct">${pct(v)}</span>
    </div>`;
  })}</div>`;
}

}

function ModelFilters({ runtime, setRuntime, language, setLanguage, query, setQuery }) {
  return html`<div class="filters">

function matchModel(m, runtime, language, query) {
  if (runtime !== "Any" && m.runtime !== runtime) return false;
  if (language === "English" && m.languages !== "English") return false;
  if (language === "Multilingual" && m.languages === "English") return false;
  return `${m.name} ${m.description}`.toLowerCase().includes(query.trim().toLowerCase());
}

function ModelRow({ m }) {
  return html`<tr>
    <td class="name"><code>${m.name}</code>${m.isDefault ? html`<span class="pill def">default</span>` : null}</td>

    <td><span class="pill">${m.runtime}</span></td>
    <td>${m.languages}</td>
    <td class="about">${m.description}</td>

}

  <//>`;
}

/* =========================================================
   4. App
   ========================================================= */
function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
}

/** Applies the theme synchronously on change, so the page never waits on a render frame to recolour. */
function useTheme() {
  const [theme, setState] = useState(() => {
    let t = "system";
    try { t = localStorage.getItem(THEME_KEY) || "system"; } catch {}
    applyTheme(t);
    return t;
  });
  const setTheme = (t) => { applyTheme(t); setState(t); };
  return [theme, setTheme];
}

function App() {
  const [theme, setTheme] = useTheme();
  return html`
    <${Nav} theme=${theme} setTheme=${setTheme} />
    <main id="main">
      <${Hero} />
      <${WhatsNew} />
      <${Multimodal} />
      <${LaunchVideo} />
      <${ModelManager} />
      <${QuickStart} />
      <${Commands} />
      <${HowItWorks} />
      <${Demo} />
      <${Playground} />
      <${DropIn} />
      <${Models} />
    </main>
    <${Footer} />`;
}
